<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./odometer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="subCounter odometer">0</div>
</body>
<style>
    .subCounter {
        font-size: 96px;
        font-family: 'Outfit';
        font-variant-numeric: tabular-nums;
    }
</style>
<script src="./odometer.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id')

    var api = "https://personalized-icq-hdtv-employ.trycloudflare.com/api/channels";

    function update() {
        fetch(api + "?ids=" + id).then(res => res.json()).then(data => {
            const c = data.channels[0];
            // console.log(c.subscriberCount)
            document.querySelector(".subCounter").textContent = c.subscriberCount;
        })
    }

    update();
    setInterval(update, 3000)
</script>
</html>
